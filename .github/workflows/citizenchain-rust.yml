name: CitizenChain Rust

# 中文注释:公民链 Rust 侧唯一自动门禁。
#
# 为什么单独一个 workflow(不并进 citizenchain-ci.yml):
#   citizenchain-ci.yml 的 paths 只有 citizenchain/node/**,抓不到 runtime/onchina/crates 改动;
#   放宽它的 paths 又会让 runtime 改动触发四平台桌面端打包,违反 ci-path-routing.md 2.1。
#   citizenchain-wasm.yml 是公民控制台专用的手动升级构建入口,不能兼作 push 门禁。
#
# 为什么挂 push 而不是 pull_request:
#   AGENTS.md 禁分支硬规则要求一切工作直接落 main、禁建任何分支,不会再有 PR,
#   挂 pull_request 等于永不触发(ai-guardrails.yml 就是这么失效了几个月的)。
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/citizenchain-rust.yml"
      - "citizenchain/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: citizenchain-rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # 编译产物硬规则:关闭跨次增量累积(citizenchain/target 曾累积到 388 GB 占满盘)。
  CARGO_INCREMENTAL: 0

jobs:
  gate:
    name: Rust 静态门禁与全量测试
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v5

      # 工具链版本与 citizenchain-wasm.yml 保持一致:Rust 钉死 1.97.1。
      # wasm32v1-none + rust-src 是 runtime build.rs 构建 WASM 所必需。
      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32v1-none
          components: rust-src, clippy

      - name: 安装系统依赖
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libclang-dev

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: citizenchain
          shared-key: citizenchain-rust-gate

      # 不设 SKIP_WASM_BUILD:node_guard 的服务级测试由 WASM_BINARY 门控,
      # 跳过 wasm 构建会让它们静默 skip,等于创世关键路径没被测到。
      - name: Clippy 门禁
        working-directory: citizenchain
        run: cargo clippy --workspace --all-targets -- -D warnings

      # 复用上一步的编译产物,不重新从零编译。
      - name: 全量测试
        working-directory: citizenchain
        run: cargo test --workspace

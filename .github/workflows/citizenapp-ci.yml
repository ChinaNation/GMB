name: CitizenApp CI

# 中文注释：不设 push 触发。向 main 推代码是纯粹的推代码，不启动任何 CI；
# CI 只能由公民控制台「公民 → 运行 CI / 正式 Release」按钮经 workflow_dispatch 发起。
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/citizenapp-ci.yml"
      - ".fvm/fvm_config.json"
      - "citizenapp/**"
      - "citizenapp/scripts/check-chainspec-frozen.sh"
      - "citizenchain/node/chainspecs/**"
  workflow_dispatch:
    inputs:
      mode:
        description: 执行 CI 或正式发布
        required: true
        type: choice
        options:
          - ci
          - release

concurrency:
  group: citizenapp-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  GMB_RELEASE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'release' }}

jobs:
  # ── 代码检查 ──
  check:
    name: Flutter 代码检查
    runs-on: ubuntu-24.04
    steps:
      - name: 拉取代码
        uses: actions/checkout@v5

      # 金标向量真源在 citizenchain/runtime/primitives；本端只持镜像。
      # 改动 citizenapp/** 只触发本条流水线，故门禁必须挂在这里，不能只挂链端。
      - name: 校验金标向量跨端一致
        run: node .github/scripts/check-golden-vectors-sync.mjs

      - name: 校验 chainspec.json 冻结
        run: |
          if [ "${GMB_RELEASE_MODE}" = "true" ]; then
            export CITIZENAPP_REQUIRE_STATE_ROOT=1
          fi
          bash citizenapp/scripts/check-chainspec-frozen.sh

      - name: 读取 Flutter 版本
        id: flutter-version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          version = json.loads(Path(".fvm/fvm_config.json").read_text(encoding="utf-8"))["flutterSdkVersion"]
          print(f"version={version}")
          PY

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}

      - name: 安装依赖
        working-directory: citizenapp
        run: flutter pub get

      - name: 分析代码
        working-directory: citizenapp
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: 运行测试
        working-directory: citizenapp
        # WalletIsar 测试模式磁盘 dir 在 systemTemp.path,实例名固定 'citizenapp'。
        # 默认 concurrency=CPU 核数,多个 isolate 并行打开同一磁盘 db 会
        # 互踩 unique index 触发 IsarError,顺序跑稳。
        run: flutter test --concurrency=1

  # ── Cloudflare Worker 与公民属于同一产品 CI，不拆分第五条流水线 ──
  cloudflare:
    name: Cloudflare 代码与 D1 结构检查
    runs-on: ubuntu-24.04
    steps:
      - name: 拉取代码
        uses: actions/checkout@v5

      - name: 安装 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: citizenapp/cloudflare/package-lock.json

      - name: 安装 Cloudflare 依赖
        working-directory: citizenapp/cloudflare
        run: npm ci

      - name: 校验 Worker 绑定类型未过期
        working-directory: citizenapp/cloudflare
        run: npm run types:check

      - name: 检查 TypeScript
        working-directory: citizenapp/cloudflare
        run: npm run typecheck

      - name: 运行 Worker 测试
        working-directory: citizenapp/cloudflare
        run: npm test

      - name: 在全新本地 D1 执行唯一 schema
        working-directory: citizenapp/cloudflare
        run: npm run db:local

  # ── Android APK 打包 ──
  android:
    name: 打包公民.apk
    runs-on: ubuntu-24.04
    needs: [check, cloudflare]
    steps:
      - name: 拉取代码
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: 读取 Flutter 版本
        id: flutter-version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          version = json.loads(Path(".fvm/fvm_config.json").read_text(encoding="utf-8"))["flutterSdkVersion"]
          print(f"version={version}")
          PY

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}

      - name: 安装 Java 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17

      - name: 配置 Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: 安装 Android SDK Platform 36
        run: sdkmanager "platforms;android-36"

      # chainspec.json 是从 plain SSOT + 创世状态包派生的 stateRootHash 轻形态。
      # runtime 升级走链上 system.setCode，不要重新 build-spec。
      # 详见 memory/07-ai/chainspec-frozen.md
      - name: 再次校验 chainspec.json 冻结
        run: |
          if [ "${GMB_RELEASE_MODE}" = "true" ]; then
            export CITIZENAPP_REQUIRE_STATE_ROOT=1
          fi
          bash citizenapp/scripts/check-chainspec-frozen.sh

      # 编译 smoldot Rust FFI 库（Android arm64-v8a + armeabi-v7a）
      - name: 编译 smoldot native library (Android ARM)
        working-directory: citizenapp
        run: ./scripts/build-smoldot-native.sh android

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "citizenapp-rust-android"
          workspaces: citizenapp/rust -> target

      - name: 安装 Flutter 依赖
        working-directory: citizenapp
        run: flutter pub get

      - name: 修复 isar_flutter_libs compileSdk
        run: |
          ISAR_GRADLE=$(find "$HOME/.pub-cache" -path "*/isar_flutter_libs*/android/build.gradle" | head -1)
          if [ -n "$ISAR_GRADLE" ]; then
            sed -i 's/compileSdkVersion 30/compileSdkVersion 36/' "$ISAR_GRADLE"
            echo "已将 isar_flutter_libs compileSdkVersion 30 → 36"
          fi

      # 非 release 的 CI 与 PR 只验证 Android 工程能构建，不读取正式签名密钥。
      # 只有控制台「正式 Release」按钮(mode=release)才生成可分发的正式签名 APK。
      - name: 写入 Android release keystore
        if: ${{ env.GMB_RELEASE_MODE == 'true' }}
        env:
          GMB_APP_KEY: ${{ secrets.GMB_APP_KEY }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          raw = os.environ.get("GMB_APP_KEY", "").strip()
          if not raw:
              raise SystemExit("手动发布缺少 GMB_APP_KEY secret。")

          props = {}
          for line in raw.splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              if "=" not in line:
                  raise SystemExit("GMB_APP_KEY 每行必须使用 key=value 格式。")
              key, value = line.split("=", 1)
              props[key.strip()] = value.strip()

          keystore_b64 = props.get("keystore")
          password = props.get("password")
          alias = props.get("alias", "upload")
          key_password = props.get("keyPassword", password)
          if not keystore_b64 or not password:
              raise SystemExit("GMB_APP_KEY 必须包含 keystore=<base64后的jks> 和 password=<密码>。")

          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          android_dir = workspace / "citizenapp" / "android"
          keystore_path = android_dir / "gmb-app-release.jks"
          keystore_path.write_bytes(base64.b64decode(keystore_b64))

          # 中文注释：两个移动端共用同一套 GMB_APP_KEY；alias 随现有 keystore 写入，key 密码默认复用 keystore 密码。
          (android_dir / "key.properties").write_text(
              "\n".join(
                  [
                      f"storeFile={keystore_path}",
                      f"storePassword={password}",
                      f"keyAlias={alias}",
                      f"keyPassword={key_password}",
                      "",
                  ]
              ),
              encoding="utf-8",
          )
          PY

      - name: 打包 Debug APK（CI 检查）
        if: ${{ env.GMB_RELEASE_MODE != 'true' }}
        working-directory: citizenapp
        run: flutter build apk --debug --target-platform android-arm,android-arm64

      # CI 模式也必须留下产物：`mode=ci → 构建不签名产物 → 上传 artifact` 是四端共用契约，
      # 公民链与 WASM 一直如此，两个移动端此前是仅有的例外(只在 Release 上传)。
      # 名字与正式包严格区分：Debug APK 用调试密钥签名、同样能装机，
      # 混用同一个名字迟早会有人把它当正式版侧载。
      - name: 重命名为公民-未签名.apk
        if: ${{ env.GMB_RELEASE_MODE != 'true' }}
        run: cp citizenapp/build/app/outputs/flutter-apk/app-debug.apk citizenapp/build/app/outputs/flutter-apk/公民-未签名.apk

      - name: 上传公民-未签名.apk
        if: ${{ env.GMB_RELEASE_MODE != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 公民-未签名.apk
          path: citizenapp/build/app/outputs/flutter-apk/公民-未签名.apk
          retention-days: 30
          overwrite: true
          if-no-files-found: error

      - name: 打包正式签名 APK
        if: ${{ env.GMB_RELEASE_MODE == 'true' }}
        working-directory: citizenapp
        run: flutter build apk --release --target-platform android-arm,android-arm64

      - name: 重命名为公民.apk
        if: ${{ env.GMB_RELEASE_MODE == 'true' }}
        run: cp citizenapp/build/app/outputs/flutter-apk/app-release.apk citizenapp/build/app/outputs/flutter-apk/公民.apk

      - name: 生成 Android 更新清单
        if: ${{ env.GMB_RELEASE_MODE == 'true' }}
        run: |
          set -euo pipefail

          version_line="$(awk '/^version:/ {print $2; exit}' citizenapp/pubspec.yaml)"
          version_name="${version_line%%+*}"
          version_code="${version_line##*+}"
          apk_path="citizenapp/build/app/outputs/flutter-apk/公民.apk"
          apk_sha256="$(shasum -a 256 "$apk_path" | awk '{print $1}')"
          published_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          manifest_path="citizenapp/build/app/outputs/flutter-apk/citizenapp-android-update.json"

          cat > "$manifest_path" <<EOF
          {
            "app": "citizenapp",
            "platform": "android",
            "package_name": "org.citizenapp",
            "version_name": "$version_name",
            "version_code": $version_code,
            "apk_asset": "公民.apk",
            "apk_sha256": "$apk_sha256",
            "published_at": "$published_at",
            "notes": "citizenapp Android $version_name+$version_code"
          }
          EOF

      # 中文注释:发布到唯一「滚动 Release」(固定 tag release,始终 Latest);同仓库三产品共用,--clobber 只覆盖公民.apk 与其清单。
      - name: 发布到滚动 Release
        if: ${{ env.GMB_RELEASE_MODE == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag="release"
          apk_path="citizenapp/build/app/outputs/flutter-apk/公民.apk"
          manifest_path="citizenapp/build/app/outputs/flutter-apk/citizenapp-android-update.json"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --latest >/dev/null
          else
            gh release create "$tag" \
              --title 'GMB 正式版' \
              --notes 'GMB 各产品最新正式版(滚动发布,始终 Latest)。' \
              --latest --target "$GITHUB_SHA"
          fi

          gh release upload "$tag" "$apk_path" "$manifest_path" --clobber

      # 只有 GitHub 页面手动运行时才维护 APK 产物。
      - name: 清理旧版 APK artifact
        if: ${{ env.GMB_RELEASE_MODE == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/artifacts" \
            --jq '.artifacts[] | select(.name == "公民.apk") | .id' \
          | while read -r id; do
              echo "删除旧 artifact: $id"
              gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
            done

      - name: 上传公民.apk
        if: ${{ env.GMB_RELEASE_MODE == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 公民.apk
          path: citizenapp/build/app/outputs/flutter-apk/公民.apk
          retention-days: 30

      - name: 上传 Android 更新清单
        if: ${{ env.GMB_RELEASE_MODE == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: citizenapp-android-update.json
          path: citizenapp/build/app/outputs/flutter-apk/citizenapp-android-update.json
          retention-days: 30

  # ── iOS（未签名） ──
  #
  # 与 android job 并列、互不阻塞。runner 钉 macos-15，与公民链桌面 macOS 同一个标签。
  #
  # continue-on-error 的存在条件：付费 Apple Developer Program 尚未到位，本机与 CI 都只有
  # Apple Development 证书、没有分发证书，iOS 只能产出未签名、不可安装的产物。让一个发不
  # 出去的平台阻断整个 run，等于用它挡住 Android 真正能发的正式版。
  # 本 job 一旦出现真签名步骤(codesign / CODE_SIGN_IDENTITY / exportArchive)，
  # 必须同时删掉 continue-on-error —— 那时 iOS 能发布了，再放行失败就是发坏包。
  # 该约束由 citizenconsole 的 production-security 测试反向钉住。
  ios:
    name: 打包公民 iOS（未签名）
    runs-on: macos-15
    needs: [check, cloudflare]
    continue-on-error: true
    steps:
      - name: 拉取代码
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: aarch64-apple-ios

      - name: 读取 Flutter 版本
        id: flutter-version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          version = json.loads(Path(".fvm/fvm_config.json").read_text(encoding="utf-8"))["flutterSdkVersion"]
          print(f"version={version}")
          PY

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}

      # 与 android job 同一道门禁：chainspec 是轻节点创世真源，两端都不得绕过。
      - name: 再次校验 chainspec.json 冻结
        run: |
          if [ "${GMB_RELEASE_MODE}" = "true" ]; then
            export CITIZENAPP_REQUIRE_STATE_ROOT=1
          fi
          bash citizenapp/scripts/check-chainspec-frozen.sh

      # ↓↓ 以下三步顺序是硬约束，颠倒会崩在很难读的 CocoaPods 报错里 ↓↓
      # 1) flutter pub get 生成 ios/Flutter/Generated.xcconfig —— Podfile 必须读它定位 FLUTTER_ROOT
      # 2) build-smoldot-native.sh ios 产出 libsmoldot.a 并从中实抽 exported_symbols.txt
      #    —— smoldot_ffi.podspec 读该清单生成 -Wl,-u，缺它则 release 的 -dead_strip 会
      #    静默剔掉全部导出符号，装机后才在运行时炸
      # 3) flutter build ios 内部自带 pod install（且自带正确的 LANG；手动跑才需要
      #    LANG=en_US.UTF-8，否则 CocoaPods 编码崩溃）
      - name: 安装 Flutter 依赖
        working-directory: citizenapp
        run: flutter pub get

      - name: 编译 smoldot native library (iOS arm64)
        working-directory: citizenapp
        run: ./scripts/build-smoldot-native.sh ios

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "citizenapp-rust-ios"
          workspaces: citizenapp/rust -> target

      - name: 构建未签名 iOS 产物
        working-directory: citizenapp
        run: flutter build ios --release --no-codesign

      - name: 打包 公民-iOS-未签名.app.zip
        run: |
          set -euo pipefail
          ditto -c -k --keepParent \
            citizenapp/build/ios/iphoneos/Runner.app \
            citizenapp/build/ios/公民-iOS-未签名.app.zip

      - name: 上传 公民-iOS-未签名.app.zip
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 公民-iOS-未签名.app.zip
          path: citizenapp/build/ios/公民-iOS-未签名.app.zip
          retention-days: 30
          overwrite: true
          if-no-files-found: error

      # 正式发布时同样挂上 iOS 产物。资产名必须让人一眼看出装不上：这是公开 Release，
      # 任何人点进去就能下载，叫「公民.ipa」会被当成能装的正式版。
      # 官网在拿到真 .ipa 之前不加任何 iOS 下载链接——固定资产名规则下必然 404。
      - name: 发布 iOS 产物到滚动 Release
        if: ${{ env.GMB_RELEASE_MODE == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag="release"
          asset="citizenapp/build/ios/公民-iOS-未签名-仅供验证.app.zip"
          cp citizenapp/build/ios/公民-iOS-未签名.app.zip "$asset"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --latest >/dev/null
          else
            gh release create "$tag" \
              --title 'GMB 正式版' \
              --notes 'GMB 各产品最新正式版(滚动发布,始终 Latest)。' \
              --latest --target "$GITHUB_SHA"
          fi

          gh release upload "$tag" "$asset" --clobber

name: AI Guardrails

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: ai-guardrails-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  guardrails:
    if: github.event.pull_request.draft == false
    name: 文档与残留门禁
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 检查文档更新与残留清理
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: ./.github/scripts/check-ai-guardrails.sh

      # 前端 pallet 注册表(citizenwallet/citizenapp)必须与链上 construct_runtime 索引一致:
      # 链上 pallet 重排后 Dart 未同步会往错误 pallet 发交易。每个 PR 静态比对,漂移即红。
      - name: 校验 pallet 注册表与链上一致
        run: node .github/scripts/check-pallet-registry-sync.mjs

name: citizenwallet
description: GMB 离线签名设备 — 软件形态的硬件钱包。
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # 密钥派生 + 签名
  # sr25519 派生/签名/验签走原生 schnorrkel(lib/wallet/native_sr25519.dart →
  # citizenchain/crates/citizen-signer，与 CitizenApp 热端同一份源码)。
  # polkadart_keyring 仅用于 SS58 地址编解码(base58 + 校验和，非密码学)。
  polkadart_keyring: ^0.7.2
  bip39_mnemonic: ^4.0.1
  substrate_bip39: ^0.7.2
  ffi: ^2.1.0
  path: ^1.9.0
  # 哈希 + 加密
  crypto: ^3.0.3
  pointycastle: ^4.0.0
  # 存储
  # Isar 3.1 上游预编译 libisar.so 只有 4 KB ELF 对齐；统一切换到
  # 16 KB 对齐的社区维护分支，保持现有 3.x API、集合与数据库格式。
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  # 生物识别
  local_auth: ^3.0.2
  # 二维码
  mobile_scanner: ^7.1.4
  qr_flutter: ^4.1.0
  # SVG 图标
  flutter_svg: ^2.3.0
  # 相册图片选择
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  isar_community_generator: ^3.3.2

flutter:
  uses-material-design: true
  assets:
    - assets/icons/

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: https:; connect-src https: wss:; frame-src https:; child-src https:; base-uri 'none'; form-action 'none'" />
    <title>连接钱包支付</title>
    <style>
      :root { color-scheme: light; }
      html, body { margin: 0; height: 100%; background: #F7F9FC; color: #1A2B3C;
        font-family: -apple-system, "PingFang SC", "Segoe UI", Roboto, sans-serif; }
      .wrap { min-height: 100%; display: flex; flex-direction: column; align-items: center;
        justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
      .spinner { width: 44px; height: 44px; border: 3px solid rgba(0,122,116,.18);
        border-top-color: #007A74; border-radius: 50%; animation: spin 1s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .title { margin: 18px 0 4px; font-size: 16px; }
      .sub { margin: 0; font-size: 13px; color: #5A6B7C; }
      .amount { margin-top: 10px; font-size: 15px; font-weight: 600; color: #007A74; }
      .err { color: #EF4444; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="spinner" id="spinner"></div>
      <p class="title" id="title">正在唤起 WalletConnect…</p>
      <p class="sub" id="sub">在弹出的钱包中确认连接与支付</p>
      <p class="amount" id="amount"></p>
    </div>
    <!-- 由 @walletconnect/ethereum-provider 2.23.10 精确版本生成并随 App 发布。 -->
    <script src="walletconnect.bundle.js"></script>
    <script>
      // 稳定币支付:WalletConnect v2 provider 连自托管钱包(MetaMask/OKX/Bitget)→ 发 ERC-20 转账。
      // SDK 固定打包进 App；禁止运行时从 CDN 执行第三方脚本。
      // 连接后先把 payer 回传 CitizenApp 创建账户绑定意图，收到 App 明确放行后才发送交易。

      const $ = (id) => document.getElementById(id);
      let provider = null;
      let payer = null;
      let paymentStarted = false;
      function report(payload) {
        if (window.TopupBridge && window.TopupBridge.postMessage) {
          window.TopupBridge.postMessage(JSON.stringify(payload));
        }
      }
      function fail(message) {
        $('spinner').style.display = 'none';
        $('title').textContent = '未完成';
        $('title').className = 'title err';
        $('sub').textContent = message;
        report({ kind: 'error', error: message });
      }

      window.startTopup = async () => {
        const cfg = window.__TOPUP__;
        if (!cfg || !cfg.projectId) { fail('WalletConnect 未配置'); return; }
        $('amount').textContent = `支付 ${cfg.payDisplay} ${cfg.token} · ${cfg.label}`;
        try {
          if (!window.WalletConnectEthereumProvider) {
            fail('WalletConnect 本地组件未加载');
            return;
          }
          provider = await window.WalletConnectEthereumProvider.init({
            projectId: cfg.projectId,
            chains: [cfg.chainId],
            showQrModal: true,
            metadata: {
              name: 'CitizenApp',
              description: '链上充值购买公民币',
              url: 'https://www.crcfrcn.com',
              icons: [],
            },
          });
          await provider.connect();
          payer = Array.isArray(provider.accounts) ? provider.accounts[0] : null;
          if (!payer) { fail('未获取到钱包地址'); return; }
          $('title').textContent = '正在创建付款意图';
          $('sub').textContent = '即将由当前公民钱包账户接收公民币';
          report({ kind: 'connected', payer });
        } catch (e) {
          fail((e && e.message) ? e.message : '钱包连接未完成或已取消');
        }
      };

      window.submitTopupPayment = async () => {
        const cfg = window.__TOPUP__;
        if (!provider || !payer || paymentStarted) {
          if (!paymentStarted) fail('付款意图创建失败，请重新发起');
          return;
        }
        paymentStarted = true;
        try {
          $('title').textContent = '请在钱包中确认支付';
          $('sub').textContent = '付款完成后将自动返回公民';
          const txHash = await provider.request({
            method: 'eth_sendTransaction',
            params: [{ from: payer, to: cfg.to, data: cfg.data, value: '0x0' }],
          });
          $('spinner').style.display = 'none';
          $('title').textContent = '已提交';
          $('sub').textContent = '正在返回 App 确认到账…';
          report({ kind: 'paid', txHash, payer });
        } catch (e) {
          fail((e && e.message) ? e.message : '支付未完成或已取消');
        }
      };

      if (window.__TOPUP__) window.startTopup();
    </script>
  </body>
</html>

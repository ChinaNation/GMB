[workspace]

[package]
name = "smoldot_ffi"
version = "1.0.0"
edition = "2021"
authors = ["GMB (ChinaNation)"]
license = "Apache-2.0"
description = "FFI bindings for smoldot-light"

[lib]
crate-type = ["cdylib", "staticlib"]
name = "smoldot"

[dependencies]
# 固定引用仓库内收编的 PoW 轻节点快照，禁止再回指根目录临时 smoldot。
smoldot-light = { path = "../smoldotpow/light-base" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
parking_lot = "0.12"
once_cell = "1.19"
libc = "0.2"
log = "0.4"
env_logger = "0.11"
blake2-rfc = "0.2"
hex = "0.4"
openmls = "0.8.1"
openmls_rust_crypto = "0.5.1"
openmls_basic_credential = "0.5.0"
openmls_traits = "0.5.0"
openmls_memory_storage = { version = "0.5.0", features = ["persistence"] }
# MLS 本地状态(设备签名私钥 + 群 ratchet 秘密)落盘信封加密。
# 用 RustCrypto 官方实现，禁止自造 AEAD。
aes-gcm = "0.10"
base64 = "0.22"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
android_logger = "0.14"

[target.'cfg(target_os = "ios")'.dependencies]
oslog = "0.2"

[profile.release]
opt-level = "z"        # Optimize for size
lto = true             # Link-time optimization
codegen-units = 1      # Better optimization
# 磁盘产物始终保留符号+行号,原生崩溃栈才能反解到 Rust 源码行(留档即符号服务器)。
# APK 侧由 AGP 分档处理:debug 包保留、release 包打包时剥离,见 android/app/build.gradle.kts。
strip = false
debug = 1
panic = "abort"        # Abort on panic (smaller binary)

[profile.dev]
opt-level = 1          # Faster compilation in dev

[build-dependencies]
cbindgen = "0.27"

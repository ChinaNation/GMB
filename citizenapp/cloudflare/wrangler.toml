name = "citizenapp-square-api"
main = "src/index.ts"
compatibility_date = "2026-07-23"
workers_dev = false
preview_urls = false
stream = { binding = "STREAM" }
routes = [{ pattern = "www.crcfrcn.com/api/*", zone_name = "crcfrcn.com" }]

# CitizenApp Cloudflare 只保留唯一生产环境。API Token、Stream webhook Secret、
# 链 RPC Access 凭据和充值令牌全部由 CitizenConsole 经 Touch ID 注入。

[[r2_buckets]]
binding = "SQUARE_MEDIA"
bucket_name = "citizenapp-square-media"

# 大媒体(>100MB)瞬时中转专用桶：仅存薪火 + >100MB 的 E2E 密文，桶级生命周期为 24h。
[[r2_buckets]]
binding = "CHAT_RELAY"
bucket_name = "citizenapp-chat-relay"

[[d1_databases]]
binding = "DB"
database_name = "citizenapp-square-db-production"
database_id = "0c5a0924-83ef-4347-bacc-b3f6f36da460"

[[kv_namespaces]]
binding = "SQUARE_CACHE"
id = "b72bbbcb36d240acb317fdaf79ce46f4"

[[durable_objects.bindings]]
name = "CHAT_REALTIME"
class_name = "ChatRealtimeObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRealtimeObject"]

[[queues.producers]]
binding = "SQUARE_NOTIFY_QUEUE"
queue = "square-notify-fanout-production"

[[queues.consumers]]
queue = "square-notify-fanout-production"
max_batch_size = 10
max_retries = 3

[triggers]
crons = ["*/5 * * * *", "0 3 * * *"]

[vars]
SESSION_TTL_SECONDS = "86400"
UPLOAD_TTL_SECONDS = "900"
MEMBERSHIP_RECONCILE_ENABLED = "1"
CREATOR_RECONCILE_ENABLED = "1"
MEMBERSHIP_RECONCILE_BATCH = "50"
APNS_ENV = "production"
IMAGES_URL = "https://imagedelivery.net/UOEmEDe-GxX_DiS70z3GIg"
STREAM_URL = "https://customer-e3w478wvlbq2nl3g.cloudflarestream.com"
MEDIA_TTL_SECONDS = "300"
WEB_ORIGIN = "https://www.crcfrcn.com"
TURNSTILE_SITEKEY = "0x4AAAAAAD0GQRiB2O3a0DYJ"

# 稳定币充值只允许 Base 主网。结算令牌和付款意图密钥必须使用 Worker Secret。
TOPUP_NETWORK = "mainnet"
TOPUP_RECV_ADDRESS = "0x5ce9b56b9d1812a7cf29841e21756f09ca7d223b"
TOPUP_BASE_RPC_URL = "https://mainnet.base.org"
TOPUP_USDC_CONTRACT = ""

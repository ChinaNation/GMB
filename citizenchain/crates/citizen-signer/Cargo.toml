[package]
name = "citizen-signer"
description = "GMB 移动端唯一 sr25519 签名实现（schnorrkel FFI）：CitizenApp 热端与 CitizenWallet 冷端共用同一份源码。"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

# 单一真源：CitizenApp（热端，编入 libsmoldot）与 CitizenWallet（冷端，独立小库）
# 都以 path 依赖本 crate，**物理上共用同一份源码**，不允许任何一端另抄一份。
[lib]
# rlib：供两端的 cdylib 静态链接。FFI 外壳由 `export_citizen_signer_ffi!()` 宏在
# 各端 cdylib 内就地生成，符号必被导出；符号检查（注意平台差异，用错标志会误判为 0）：
#   Android/ELF   llvm-nm -D <lib>.so    | grep -c citizen_sr25519  应为 4
#   macOS/Mach-O  llvm-nm -g <lib>.dylib | grep -c citizen_sr25519  应为 4
crate-type = ["rlib"]

[dependencies]
# 版本与 citizenapp/smoldotpow/lib 保持一致，全仓单一 sr25519 实现。
schnorrkel = { version = "0.11.2", default-features = false, features = [
    "preaudit_deprecated",
    "alloc",
    "getrandom",
] }
# 私钥材料作用域结束即擦除，禁止手写清零（会被编译器优化掉）。
zeroize = "1"
